steps:[['0–2','材質介紹','讓大家摸摸 4 種布料：一般棉、重磅棉、涼感、吸濕排汗。'],['2–8','盲摸搶答','(1) 兩隊先各自排成一排，<b>同時進行</b>，各自輪流派人上場。<br>(2) 上場的人抽一張地形牌，戴上眼罩摸布料。<br>(3) 說出正確的布料材質，答對得 1 分。<br>(4) 答對的隊伍，換下一位隊員上場；還沒答對的隊伍，繼續猜。<br>(5) 答對的隊員可以登上「光華號悅讀列車」。<br>(6) 時間到時，看哪一隊在火車上的人數比較多，人數多的隊伍獲勝。<br>(7) <b class="rd">如果兩隊人數一樣，就再玩一次。</b><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAcFBQYFBAcGBgYIBwcICxILCwoKCxYPEA0SGhYbGhkWGRgcICgiHB4mHhgZIzAkJiorLS4tGyIyNTEsNSgsLSz/2wBDAQcICAsJCxULCxUsHRkdLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCwsLCz/wAARCAI4AoADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwDgbm1uIJj5q+avl8Mi8/lVEQLIUZcHEfUdRXR+e6yILmLjyvvIMjtVZtPhuVieJsExn5kOK5rm5gCSWFhvXzVMZGR1q3aakVA2PuAjztPrUj2c8Xll181TEeV6/lVFrZJQhU5byzyOCKYjeS/D7QAA20Fs9MGrm1iCVxnHGa5YPPArFh5ymIc9CK0rbUAZpNjn7yja3BH4UgNobgQGAz3xWjpZb95ux0OCPSsiCUSA5JyzEcmtLTApmb5/vKcLmgaJhv8AtBOV2Y6d81NFPcQS+ZbSeXIhBzjtUEgVZlLMVw3HPWnSqvlT7mKjaDkHHegZt2mq2t4+2+Agl6CZF4P+8P6irFxZMgDgCSJvuyIcqfxrlwwIOeQRVnSdTnsbPfbSEoXwUb5lb6g07kONzbFurQFWHBqh9jkiY7Gyvoe1adjq+n6i3lnFrcDgox+Qn2PatQ6d1BXFO9ybNHJ2SSWFhDbSMG8pAu4dDVpZARwa3pdGSdSCuPese/0a5tPnhIZcdM9aVi1LuMV/cU8YbvVKCK+lPFrIvuwxWjDp1yfvlV/GizBtGJdW8n9vSGAASmzBU5xk7z1qtFet/bKi9ga2fyCmTypO4cg+ldUujxrei6eVmk8vysDpjOae2n2iyrKYwz4K5Poe1PlJ5kczDGH1a92jcCsZBHPY1aFlKxwsbH8K6SK3iiA8uJE/3VAqTA5o5Rcxza6TcufuAfU1KNCmbrIo/WugA74pTgGqUULmZjJoQA+acn6CpbXRbe1t0iBdlQYGT71qGomlVGAZgue5NFkhXZD9jUABABz35qURIOi0x7+1i+/cxr6/NVd9a08cfaVJ9ua steps:[['0–2','辨香教學','請大家認識 1～5 號香：1 澳洲檀香、2 惠安沉香、3 芽莊沉香、4 老山檀香、5 楞嚴十香。'],['2–10','嗅覺挑戰','盲聞香氣，說出是哪一種香。'],['10–13','解謎','<b class="rd">贏的隊伍先解謎，解完再換另一隊。</b><br>掃描 QR Code，打開香氣寶箱，聞出三陣香氣各是幾號香，排成三位數密碼（答錯會清空重輸）。寶箱打開後顯示社刊、頁數和標題，隊伍告訴關主，確認後再給關鍵句。'],['13–15','蓋章','蓋第 5 號印章。']],

steps:[['0–2','任務說明','說明規則：用角色卡推理出社員是誰。'],['2–10','職人大搜查','(1) 隊伍依角色卡上的<b>職業類別</b>和<b>所屬社</b>，到主視覺看板找出這張卡的主人。<br>(2) 找人時，也可以參考<b>註冊桌上的簽到表</b>。<br>(3) 找對了，就得到 1 張職人字卡。<br>(4) <b class="rd">如果卡片主人本人沒來</b>，可以直接跟關主說出「扶青社名＋姓名」，答對一樣得到字卡。'],['2–10','關主核對答案','(1) 隊伍說出卡片主人是誰後，關主點上方的<b class="rd">「關主查詢」</b>頁籤。<br>(2) 看角色卡<b class="rd">右下角的 No. 編號</b>（下圖紅框處），在數字鍵盤輸入 3 位數，例如 No.001 就輸入 0、0、1。<br>(3) 三位數都輸入後，按「確定查詢」。<br>(4) 畫面會顯示這張卡的主人。<b>和隊伍說的一樣</b>，就給 1 張職人字卡；不一樣，請隊伍再找找看。<span style="display:block;margin:10px 0 4px;text-align:center"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUEBAQEAwUEBAQGBQUGCA0ICAcHCBALDAkNExAUExIQEhIUFx0ZFBYcFhISGiMaHB4fISEhFBkkJyQgJh0gISD/2wBDAQUGBggHCA8ICA8gFRIVICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICD/wAARCAIrAxYDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwChFK8RwOV9KvRyLIuVP4VQxSqSrblODX7FKNz8ji7GjijFc3qnir+y7wWz2RlJQNuD4qkPHke4btObb3w4zXK6kU7M7Y4epNKUVodjijFc1F420h1zLFcRH02Bv5GoJvHVkuRBZTSe7ELR7WPcFhqu3KdZijFcnF46s2wJrGZPUqQalfxxpYHyW1wx91A/rR7WPcf1ar/KdHLAsq+hHQ1QeNo22sP/AK9YTeO4d3yac+P9pxUb+OIpF2tprf8AfYqo4iK6kvB1Xrym/ijFcsfGAwdtgc+703/hMZP+fBf+/n/1q0+sU+5H1Gv/AC/kdXijFc5F4vtTgTWkqe6kGp38V6Yq5RJnPpsx/WqVeHch4SsnblNzFGK5weL7Xdj7HLt9cirC+K9LK5YTKfTZn+tCrwfUHhKy+ybeKmglMbbWPyn9K5//AISrSfWb/v3/APXo/wCEp0n1m/790OrB9QWGrL7LOuHIyD1prOoIUHLHgKvJP4Vzlj4v0EXSpqLXv2MDJEEY3sfTk8fWvSdA+L/wi0eWMr4Q1RHQf8fEipKxPrjdXk4rGSpaUoOX5HqYbL/aq9WSj+ZRg8LeKrq3+0QeH7tosZyVxn ).hidden=m!=='enter';\n  $('quiz').hidden=m==='enter';\n  $('qpanel').hidden=m==='win';\n  $('back').textContent=m==='win'?'🔁 再查一張':'↩ 換一張卡';\n  window.scrollTo(0,0);\n}\nfunction renderQ(){\n  const q=qs[qi];\n  $('qprog').textContent='第 '+(qi+1)+' / '+qs.length+' 題';\n  $('qtext').textContent=q.q;\n  $('plist').innerHTML=q.o.map((t,i)=>'<button class=\"opt'+(t.length>20?' long':'')+'\" data-i=\"'+i+'\">'+esc(t)+'<\/button>').join('');\n  fb('');\n}\nfunction fb(t,good){const e=$('fb');e.textContent=t;e.className=good?'feedback ok':'feedback'}\nfunction start(p){\n  qs=buildQs(p);qi=0;wrong=0;locked=false;\n  $('qno').textContent='No.'+String(p[0]).padStart(3,'0')+'・闖關中';\n  $('win').innerHTML='';setMode('quiz');renderQ();\n}\nfunction win(){\n  const p=D.find(r=>r[0]===parseInt(s,10));\n  setMode('win');\n  cardHtml(p,'答對了！牆上的你就是','<p class=\"lead\" style=\"margin-top:12px\">'+(wrong?'共答錯 '+wrong+' 次':'一次就全部答對！')+'<\/p>',$('win'));\n}\nfunction reset(){s='';err=false;$('win').innerHTML='';setMode('enter');showEnter()}\nfunction key(k){\n  if(mode!=='enter')return;\n  if(k==='e'){\n    if(s.length<3)return;\n    const p=D.find(r=>r[0]===parseInt(s,10));\n    if(!p){err=true;showEnter();return}\n    start(p);return;\n  }\n  err=false;\n  if(/^\\d$/.test(k)){if(s.length<3)s+=k}\n  else if(k==='b'){s=s.slice(0,-1)}\n  else if(k==='c'){s=''}\n  showEnter();\n}\n$('pad').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;key(b.dataset.k||b.textContent.trim())});\n$('plist').addEventListener('click',e=>{\n  const b=e.target.closest('button');if(!b||locked||b.disabled)return;\n  const q=qs[qi],i=+b.dataset.i;\n  if(q.o[i]===q.a){\n    locked=true;b.classList.add('good');fb('答對了！',true);\n    setTimeout(()=>{locked=false;qi++;qi<qs.length?renderQ():win()},700);\n  }else{\n    wrong++;b.disabled=true;b.classList.add('bad');fb('不是這個，再想想看');\n  }\n});\n$('back').addEventListener('click',reset);\ndocument.addEventListener('keydown',e=>{\n  if(mode!=='enter')return;\n  if(/^\\d$/.test(e.key))key(e.key);\n  else if(e.key==='Enter'){e.preventDefault();key('e')}\n  else if(e.key==='Backspace')key('b');\n  else if(e.key==='Escape')key('c');\n});\nshowEnter();\n\n<\/script><script>(function(){var p=function(){parent.postMessage({h:document.body.offsetHeight},'*')};addEventListener('load',p);new ResizeObserver(p).observe(document.body);p()})()<\/script><\/body><\/html>\n"};

 if(V.tab=='ans'){

  return h}
 if(V.tab=='qr')return s.q?`<h2>${s.k}・遊戲網頁</h2><div class="qrbox"><img src="${s.q}" alt="QR Code"></div><div class="note">請隊伍用手機或平板掃描；也可以直接開啟連結：<br><a href="${s.u}" target="_blank" rel="noopener">${s.u}</a></div>`+(s.qi?`<h2>掃描後會看到的畫面</h2><div class="qrbox"><img src="${s.qi}" alt="遊戲網頁畫面" style="image-rendering:auto;max-width:100%"></div>`:''):'<div class="card">本關沒有遊戲網頁 QR Code。</div>';
 if(V.tab=='dia'){

  return `<div class="card">你是 <b>日記 No.${D[o]}</b> 的主人<br>拿你日記的隊伍：<b>第 ${t[0]}、${t[1]} 隊</b></div><details><summary>點一下顯示正確暗號</summary><div><div class="sent">${P[o]}</div></div></details><div class="note">確認隊伍正確、暗號也正確！就可以依照隊伍人數給指南針禮品。</div>`}

 h+='<h2>印章與暗號編號</h2><table><tr><th>關</th><th>印章</th><th>暗號</th></tr>'+S.map(x=>`<tr><td><b style="color:${x.c}">${x.k}</b></td><td>第 ${x.st} 號</td><td>${CI[x.ci]}</td></tr>`).join('')+'</table>';
 return h}
